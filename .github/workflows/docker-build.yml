# =============================================================================
# ATLAS — CI/CD: Build & Push Docker image to GHCR
# Триггер: push в main при изменениях в docker/, skills/, src/, docker-compose.yml
# Результат: ghcr.io/<owner>/atlas:latest + ghcr.io/<owner>/atlas:<sha>
# =============================================================================

name: Build & Push ATLAS Image

on:
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "skills/**"
      - "src/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-build.yml"

  # Ручной запуск (для первой сборки или экстренного пересборки)
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to GHCR?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

# Запретить параллельные сборки для одной ветки
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: graffgrey87/project-atlas

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build Docker image и запустить smoke-тест (CPU)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    # Нужны права на запись в GHCR и чтение содержимого репозитория
    permissions:
      contents: read
      packages: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Настройка QEMU (для мультиплатформенных сборок, если понадобится)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Настройка Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Авторизация в GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Метаданные образа (теги и labels по OCI-стандарту)
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest — для main ветки
            type=raw,value=latest,enable={{is_default_branch}}
            # SHA коммита (короткий) — для точного воспроизведения
            type=sha,prefix=,format=short
            # Дата сборки — для истории
            type=raw,value=build-{{date 'YYYYMMDD'}},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ATLAS Vibe-Coding Environment
            org.opencontainers.image.description=Autonomous AI coding environment (vLLM + Android + Unity + Godot + Blender)
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # 6. Сборка и пуш с кэшированием через GitHub Actions Cache
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Пушить только если это push в main или ручной запуск с push_image=true
          push: ${{ github.event_name == 'push' || github.event.inputs.push_image == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш — ускоряет повторные сборки в 3-5 раз
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Передать GITHUB_REPOSITORY для LABEL в Dockerfile
          build-args: |
            GITHUB_REPOSITORY=${{ github.repository }}
          # Платформа: только linux/amd64 (RunPod)
          platforms: linux/amd64
          # Провенанс и SBOM — для безопасности цепочки поставок
          provenance: true
          sbom: true

      # 7. Smoke-тест импортов на CPU (без GPU)
      #    Проверяет: vLLM, PyTorch, aiogram — не падают при import
      - name: Smoke test (CPU import check)
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker run --rm \
            --entrypoint python3 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            -c "
          import sys
          print(f'Python: {sys.version}')

          import torch
          print(f'PyTorch: {torch.__version__}, CUDA available: {torch.cuda.is_available()}')

          import vllm
          print(f'vLLM: {vllm.__version__}')

          import aiogram
          print(f'aiogram: {aiogram.__version__}')

          import hf_transfer
          print(f'hf_transfer: OK')

          print('=== SMOKE TEST PASSED ===')"

      # 8. Вывод итогов сборки
      - name: Build summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Параметр | Значение |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tags** | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Job 2: Оповещение об успешном пуше (опционально — через GitHub Deployment)
  # ---------------------------------------------------------------------------
  notify-success:
    name: Notify Success
    needs: build-and-push
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: read

    steps:
      - name: Create GitHub Deployment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'runpod',
              description: 'ATLAS image pushed to GHCR',
              auto_merge: false,
              required_contexts: []
            });
