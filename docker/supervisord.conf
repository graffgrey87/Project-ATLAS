; =============================================================================
; ATLAS — supervisord.conf
; Менеджер процессов внутри контейнера (PID 1 через nodaemon=true)
; Управляет: vLLM (порт 8000) и mobile_bridge.py
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
; Не перезапускать дочерние процессы автоматически при старте supervisord
childlogdir=/workspace/logs

; -----------------------------------------------------------------------------
; vLLM — LLM inference engine
; Аргументы сгенерированы в entrypoint.sh на основе zero-config анализа GPU
; -----------------------------------------------------------------------------
[program:vllm]
command=/bin/bash -c "exec python3 -m vllm.entrypoints.openai.api_server $(cat /tmp/vllm_args.conf)"
directory=/workspace
autostart=false
autorestart=unexpected
; vLLM не должен перезапускаться при намеренном shutdown (exit 0)
exitcodes=0
startsecs=30
startretries=2
stopwaitsecs=60
stdout_logfile=/workspace/logs/vllm.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=2
stderr_logfile=/workspace/logs/vllm_err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=1
environment=HF_HOME="/workspace/hf_cache",HF_HUB_ENABLE_HF_TRANSFER="1"
priority=100

; -----------------------------------------------------------------------------
; mobile_bridge.py — Telegram-бот и мобильный клиент
; Запускается после vLLM (priority > 100), но не блокируется им
; -----------------------------------------------------------------------------
[program:mobile_bridge]
command=python3 /atlas/src/mobile_bridge.py
directory=/workspace
autostart=true
autorestart=true
startsecs=10
startretries=5
stopwaitsecs=20
stdout_logfile=/workspace/logs/mobile_bridge.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=2
stderr_logfile=/workspace/logs/mobile_bridge_err.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=1
priority=200

; -----------------------------------------------------------------------------
; supervisorctl через Unix socket (для управления изнутри контейнера)
; -----------------------------------------------------------------------------
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
